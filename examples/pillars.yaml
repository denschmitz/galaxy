target:
  name: Pillars of Creation
  # Known approximate center of the Pillars of Creation.
  ra_deg: 274.7003
  dec_deg: -13.8067
  region:
    # Sky search box in arcminutes. Edit these to change the crop on the sky.
    kind: box
    width_arcmin: 1.5
    height_arcmin: 1.5

search:
  missions: ["HST", "JWST"]
  instruments: []
  detectors: []
  filters: ["F090W", "F200W", "F444W", "F502N", "F657N", "F673N"]
  product_types: ["SCIENCE", "DRZ", "DRC", "I2D"]
  observation_date_start: null
  observation_date_end: null
  observation_selection: deepest_per_filter
  max_observations_per_filter: 1

canvas:
  center:
    mode: explicit
    ra_deg: 274.7003
    dec_deg: -13.8067
  projection: TAN
  # Output raster size. Edit width/height directly to change output resolution.
  pixel_scale_arcsec: 0.08
  width: 5000
  height: 5000
  rotation_deg: 0.0
  flux_conserving: true

planes:
  enabled_filters: ["F090W", "F200W", "F444W", "F502N", "F657N", "F673N"]
  disabled_plane_ids: []
  export_multiplane_fits: true

mapping:
  defaults:
    strategy: continuum
  # Mapping guidance:
  # 1. Semantic presentation: map filters to scene components such as dust,
  #    ionized gas, shocks, and stars by giving each filter a custom RGB mix.
  # 2. Continuum presentation: leave mapping.planes empty and Galaxy will spread
  #    filters across a blue-to-red visible continuum by wavelength order.
  planes:
    - filter: F444W
      label: dust
      rgb: {red: 1.00, green: 0.32, blue: 0.06}
    - filter: F200W
      label: stars
      rgb: {red: 0.95, green: 0.95, blue: 1.00}
    - filter: F090W
      label: scattered_light
      rgb: {red: 0.10, green: 0.35, blue: 1.00}
    - filter: F657N
      label: ionized_hydrogen
      rgb: {red: 1.00, green: 0.16, blue: 0.10}
    - filter: F673N
      label: shocked_gas
      rgb: {red: 0.90, green: 0.45, blue: 0.08}
    - filter: F502N
      label: oxygen
      rgb: {red: 0.08, green: 0.85, blue: 1.00}
  derived_planes: []

tone:
  stretch:
    red:
      kind: asinh
      parameter: 5.0
    green:
      kind: asinh
      parameter: 4.5
    blue:
      kind: asinh
      parameter: 4.0
  percentiles:
    black: 0.5
    white: 99.7
  gain:
    red: 1.0
    green: 1.0
    blue: 1.05
  bias:
    red: 0.0
    green: 0.0
    blue: 0.0
  saturation: 1.15

psf:
  enabled: false
  common_psf_fwhm_arcsec: null
  per_plane: {}

execution:
  fail_fast: false


